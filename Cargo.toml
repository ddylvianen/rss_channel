[package]
name = "rss-updates"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio-postgres = "0.7.18"
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "macros", "full"] }
rss = "2.1.2"
reqwest = "0.13.5"
channel = "0.3.13"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
scraper = "0.27.0"
